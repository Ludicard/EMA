services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ema}
    expose:
      - '5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ema_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ema}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@db:5432/ema?schema=public}
      PORT: ${PORT:-4000}
    expose:
      - '4000'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ema_network
      - proxy_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.aurelianova.tech}
    restart: always
    expose:
      - '80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ema_network
      - proxy_network

networks:
  ema_network:
    name: ema_network
    driver: bridge
  proxy_network:
    external: true

volumes:
  pgdata:
